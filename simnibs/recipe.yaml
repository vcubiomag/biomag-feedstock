schema_version: 1

context:
  version: "4.6.0"

package:
  name: simnibs
  version: ${{ version }}

source:
  git: https://github.com/vcubiomag/simnibs.git
  rev: "06a9d565cfdeecaf5120518bc4db494d79ef6afd"

build:
  skip: win
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - python
    - pip
    - scikit-build-core
    - numpy >=2.0.0
    - cython
    - cgal-cpp >=6,<7
    - tbb-devel >=2022.3.0,<2023
    - eigen >=5.0.1,<6
  run:
    - python
    - numpy >=2.4.3,<3
    - cgal-cpp >=6,<7
    - tbb-devel >=2022.3.0,<2023
    - eigen >=5.0.1,<6
    - scipy >=1.17.1,<2
    - h5py >=3.15.1,<4
    - nibabel >=5.4.0,<6
    - cortech >=0.1,<0.2
    - python-mumps >=0.0.6,<0.0.7
    - petsc4py >=3.24.4,<4
    - mpich
    - if: linux or win
      then: petsc * mkl_real_*
    - jsonschema >=4.26.0,<5
    - fmm3dpy >=2.1.0,<3
    - pygpc >=0.4.4,<0.5
    - samseg >=0.6a0.dev0,<0.6a1
    - pytorch >=2.10.0,<3
    - brainnet >=0.2,<0.3
    - numba >=0.64.0,<0.65
    - requests >=2.32.5,<3
    - gmsh >=4.15.0,<5

tests:
  - python:
      imports:
        - simnibs
  - script:
      - pytest -v tests
    files:
      source:
        - tests/
    requirements:
      run:
        - pytest
        - mock
