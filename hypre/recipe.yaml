schema_version: 1

context:
  name: hypre
  version: "3.1.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/hypre-space/hypre/archive/v${{ version }}.tar.gz
  sha256: a6879ae9375d95c26afd97141d61e7a8092807333bf40cd180b385aed7351b2d

build:
  number: 0
  skip: unix
  script:
    - |
      cd src
      mkdir build && cd build
      cmake %CMAKE_ARGS% -G Ninja ^
        -DCMAKE_BUILD_TYPE=Release ^
        -DHYPRE_ENABLE_SHARED=ON ^
        -DHYPRE_ENABLE_MPI=ON ^
        -DHYPRE_WITH_FEI=OFF ^
        -DHYPRE_ENABLE_INTERNAL_BLAS=OFF ^
        -DHYPRE_ENABLE_INTERNAL_LAPACK=OFF ^
        -DCMAKE_INSTALL_PREFIX=%LIBRARY_PREFIX% ^
        ..
      cmake --build . --config Release
      cmake --install . --config Release

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - msmpi
    - libblas
    - liblapack
  run_exports:
    weak:
      - ${{ pin_subpackage('hypre', upper_bound='x.x') }}

tests:
  - script:
      - if exist %LIBRARY_PREFIX%\lib\HYPRE.lib (exit /b 0) else (exit /b 1)
      - if exist %LIBRARY_PREFIX%\include\HYPRE.h (exit /b 0) else (exit /b 1)

about:
  summary: High performance preconditioners for sparse linear systems (Windows build)
  license: Apache-2.0
  license_file: COPYRIGHT
  homepage: https://github.com/hypre-space/hypre
  repository: https://github.com/hypre-space/hypre
