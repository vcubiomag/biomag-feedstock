schema_version: 1

context:
  version: "3.1.0"

package:
  name: hypre
  version: ${{ version }}

source:
  url: https://github.com/hypre-space/hypre/archive/v${{ version }}.tar.gz
  sha256: a6879ae9375d95c26afd97141d61e7a8092807333bf40cd180b385aed7351b2d

build:
  skip: unix
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - libblas
    - liblapack
    - msmpi
  run_exports:
    - ${{ pin_subpackage("hypre", upper_bound="x.x") }}

tests:
  package_contents:
    bin:
      - HYPRE.dll
    lib:
      - HYPRE.lib
    include:
      - HYPRE.h

about:
  license: Apache-2.0
  license_file: COPYRIGHT
  summary: high performance preconditioners for sparse linear systems
  description: |
    HYPRE is a library of high performance preconditioners and solvers featuring
    multigrid methods for the solution of large, sparse linear systems of equations
    on massively parallel computers.
  homepage: https://www.llnl.gov/casc/hypre/
  repository: https://github.com/hypre-space/hypre
  documentation: https://hypre.readthedocs.io

extra:
  recipe-maintainers:
    - dalcinl
    - minrk
    - davidbrochart
    - SylvainCorlay
    - matthiasdiener
