python:
  - 3.11
  - 3.12
  - 3.13
  - 3.14

mpi:
  - if: unix
    then:
      - mpich
      - openmpi
  - if: win
    then: msmpi

scalar:
  - real
  - complex

fortran_compiler:
  - if: unix
    then: gfortran
  - if: win
    then: ifx
fortran_compiler_version:
  - if: unix
    then: 14
  - if: win
    then: 2025
