context:
  name: pygpc
  version: 0.4.4

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  git: https://github.com/pygpc-polynomial-chaos/pygpc.git
  rev: "51c975354b8c4db0c579cd30b284d5bdc7b3f7f7"
  patches:
    - patches/openmp_link_fix.patch

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: osx
      then: llvm-openmp
    - if: linux
      then: libgomp
  host:
    - python
    - pip
    - setuptools
    - numpy >=2.0.0
  run:
    - python
    - numpy
    - scipy
    - scikit-learn
    - h5py
    - tqdm
    - pandas
    - matplotlib-base
    - seaborn-base

tests:
  - python:
      imports:
        - pygpc
  # - script:
  #     - cd tests
  #     - python -m unittest
  #   files:
  #     source:
  #       - tests/

about:
  homepage: https://github.com/pygpc-polynomial-chaos/pygpc
  license: GPL-3.0-only
  summary: A sensitivity and uncertainty analysis toolbox for Python
  repository: https://github.com/pygpc-polynomial-chaos/pygpc
  documentation: https://pygpc.readthedocs.io/en/latest/
