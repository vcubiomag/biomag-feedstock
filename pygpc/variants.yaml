c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
  - if: win
    then: vs2022

cxx_compiler:
  - if: linux
    then: gxx
  - if: osx
    then: clangxx
  - if: win
    then: vs2022

fortran_compiler:
  - if: linux or osx
    then: gfortran
  - if: win
    then: vs2022

python:
  - 3.11
  - 3.12
  - 3.13
  - 3.14
