zip_keys:
  -                               # [unix]
    - c_compiler_version          # [unix]
    - cxx_compiler_version        # [unix]
    - fortran_compiler_version    # [unix]
  -
    - python
    - is_python_min

c_compiler:
  - gcc                         # [linux]
  - clang                       # [osx]
  - vs2022                      # [win]

c_compiler_version:             # [unix]
  - 14                          # [linux]
  - 19                          # [osx]

cxx_compiler:
  - gxx                         # [linux]
  - clangxx                     # [osx]
  - vs2022                      # [win]

cxx_compiler_version:           # [unix]
  - 14                          # [linux]
  - 19                          # [osx]

fortran_compiler:               # [unix or win64]
  - gfortran                    # [linux64 or osx]
  - flang                       # [win64]

fortran_compiler_version:       # [unix or win64]
  - 14                          # [linux]
  - 14                          # [osx]
  - 22                          # [win64]

c_stdlib:
  - sysroot                     # [linux]
  - macosx_deployment_target    # [osx]
  - vs                          # [win]

c_stdlib_version:               # [unix]
  - 2.17                        # [linux]
  - 11.0                        # [osx]

llvm_openmp:                    # [osx]
  - 19                          # [osx]

MACOSX_DEPLOYMENT_TARGET:       # [osx]
  - 11.0
