name: Build and Upload Conda Package

permissions:
  id-token: write

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          - os: windows-latest
            target-platform: win-64
          - os: macos-15
            target-platform: osx-arm64
          - os: macos-15-intel
            target-platform: osx-64
      fail-fast: false

    name: Build (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup rattler-build
        uses: prefix-dev/rattler-build-action@v0.2.36
        with:
          setup-only: true
      
      - name: Build packages
        shell: bash
        run: |
          rattler-build build --recipe surfa --recipe samseg --recipe pygpc --recipe hypre --recipe petsc --recipe fmm3dpy --recipe cgal-cpp \
            --variant-config conda_build_config.yaml --skip-existing=all --experimental \
            -c conda-forge -c https://prefix.dev/vcubiomag

      - name: Upload packages
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \) ); do
            echo "Uploading ${pkg}"
            rattler-build upload prefix -c vcubiomag "${pkg}"
          done
