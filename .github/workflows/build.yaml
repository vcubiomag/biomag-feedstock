name: Build and Upload Conda Package

permissions:
  id-token: write

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
          # - os: windows-latest
          #   target-platform: win-64
          - os: macos-latest
            target-platform: osx-arm64
      fail-fast: false

    name: Build (${{ matrix.target-platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
      - name: Build packages
        shell: bash
        run: |
          pixi run rattler-build build \
            --recipe surfa/recipe.yaml \
            --recipe samseg/recipe.yaml \
            --recipe cgal-cpp/recipe.yaml \
            --recipe fmm3dpy/recipe.yaml \
            --recipe petsc/recipe.yaml \
            --recipe pygpc/recipe.yaml \
            --recipe simnibs/recipe.yaml \
            --skip-existing=all --target-platform=${{ matrix.target-platform }} \
            -c https://prefix.dev/vcubiomag -c conda-forge --experimental
      - name: Upload packages
        shell: bash
        run: |
          shopt -s nullglob
          EXIT_CODE=0
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \) ); do
            if ! rattler-build upload prefix -c vcubiomag "${pkg}"; then
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE
